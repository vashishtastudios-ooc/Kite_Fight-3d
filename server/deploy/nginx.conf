# HTTPS + WebSocket for PATANGBAZ.
# If the app runs in Docker and nginx is on the host, keep 127.0.0.1:8787
# (compose publishes that port). If nginx is also a container on the same
# compose/network, use: server patangbaz:8787;
#
# Point www.game.azziop.com at this box, then install this site and a cert.

upstream patangbaz {
	server 127.0.0.1:8787;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name www.game.azziop.com game.azziop.com;
	return 301 https://www.game.azziop.com$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.game.azziop.com game.azziop.com;

	# ssl_certificate     /etc/letsencrypt/live/www.game.azziop.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/www.game.azziop.com/privkey.pem;

	client_max_body_size 1m;

	location /ws {
		proxy_pass http://patangbaz;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
	}

	location / {
		proxy_pass http://patangbaz;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
