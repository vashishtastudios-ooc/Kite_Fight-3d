# HTTPS + WebSocket for PATANGBAZ on the VPS.
# Point www.game.azziop.com at this box, then:
#   sudo cp nginx.conf /etc/nginx/sites-available/patangbaz
#   sudo ln -sf /etc/nginx/sites-available/patangbaz /etc/nginx/sites-enabled/
# Get a cert (certbot) and reload nginx.

upstream patangbaz {
	server 127.0.0.1:8787;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name www.game.azziop.com game.azziop.com;
	return 301 https://www.game.azziop.com$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.game.azziop.com game.azziop.com;

	# ssl_certificate     /etc/letsencrypt/live/www.game.azziop.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/www.game.azziop.com/privkey.pem;

	client_max_body_size 1m;

	location /ws {
		proxy_pass http://patangbaz;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
	}

	location / {
		proxy_pass http://patangbaz;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
